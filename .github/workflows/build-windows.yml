name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            HerbAIrium/sidecar/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r HerbAIrium/sidecar/requirements.txt pyinstaller

      - name: Build Windows sidecar
        run: >
          pyinstaller HerbAIrium/sidecar/sidecar.spec
          --noconfirm
          --clean
          --distpath HerbAIrium/sidecar/dist
          --workpath HerbAIrium/sidecar/build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            electron/renderer/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install renderer dependencies
        working-directory: electron/renderer
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        run: |
          $version = $env:GITHUB_REF_NAME -replace "^v", ""
          npm version $version --no-git-tag-version

      - name: Build Windows installer
        working-directory: electron
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HerbAIrium-Windows
          path: dist/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            HerbAIrium/sidecar/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r HerbAIrium/sidecar/requirements.txt pyinstaller

      - name: Build macOS sidecar
        run: >
          pyinstaller HerbAIrium/sidecar/sidecar.spec
          --noconfirm
          --clean
          --distpath HerbAIrium/sidecar/dist
          --workpath HerbAIrium/sidecar/build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            electron/renderer/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install renderer dependencies
        working-directory: electron/renderer
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build macOS disk image
        working-directory: electron
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: HerbAIrium-macOS
          path: dist/*.dmg
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: HerbAIrium-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "HerbAIrium $GITHUB_REF_NAME" \
              --generate-notes
          fi
